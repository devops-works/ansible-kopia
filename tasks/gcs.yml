---
- name: Handle repository creation
  block:
    - name: Check repository state
      ansible.builtin.command: "gsutil ls gs://{{ kopia_gcs_bucket }}/kopia.repository"
      changed_when: false
  rescue:
    - name: Create repository
      ansible.builtin.command: "kopia repository create gcs --bucket {{ kopia_gcs_bucket }} --password {{ kopia_gcs_password }}"
      args:
        creates: "~/.config/kopia/repository.config"

- name: Handle repo connection
  block:
    - name: Check if repo is connected
      ansible.builtin.command: "kopia repository status"
      failed_when: false
      changed_when: false
  rescue:
    - name: Connect to repository
      ansible.builtin.command: "kopia repository connect gcs --bucket {{ kopia_gcs_bucket }} --password {{ kopia_gcs_password }}"
