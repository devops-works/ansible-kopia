- name: Add apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: 0755

- name: Adds deb repository signing key
  get_url:
    url: https://kopia.io/signing-key
    dest: /etc/apt/keyrings/kopia.asc
    owner: root
    group: root
    mode: 0644

- name: Adds apt source
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kopia.asc] http://packages.kopia.io/apt/ stable main"
    filename: kopia

- name: Install kopia & fuse
  apt:
    pkg:
      - fuse
      - kopia
    state: present

- name: Add environment variables
  lineinfile:
    path: /etc/environment
    line: "{{ item.key | upper }}={{ item.value }}"
    create: yes
  with_dict: "{{ kopia_environment_vars }}"

- name: Add /var/log/kopia directory for cron logs
  file:
    path: /var/log/kopia
    state: directory
    owner: root
    group: root
    mode: 0750

- name: Add logrotate entry for logs
  template:
    src: kopia.logrotate.j2
    dest: /etc/logrotate.d/kopia
    owner: root
    group: root
    mode: 0644
